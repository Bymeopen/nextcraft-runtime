version = 1
SPDX-PackageName = "NextCraft Forge"
SPDX-PackageDownloadLocation = "https://github.com/bymeopen/nextcraft-forge"

# Default: the combined work. Later annotations override earlier ones (precedence = "override").
[[annotations]]
path = "**"
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 NextCraft Forge contributors"
SPDX-License-Identifier = "GPL-3.0-only"

